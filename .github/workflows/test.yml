name: Emacs Lisp tests

on:
  pull_request:
  push:
    branches:
      - feature/emacs-runtime-v0.1

permissions:
  contents: read

jobs:
  ert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs-nox
      - name: Install gptel
        run: |
          emacs -Q --batch --eval '(progn
            (require (quote package))
            (setq package-archives
                  (quote (("gnu" . "https://elpa.gnu.org/packages/")
                          ("melpa" . "https://melpa.org/packages/"))))
            (package-initialize)
            (package-refresh-contents)
            (package-install (quote gptel)))'
      - name: Byte compile
        run: >-
          emacs -Q --batch -l package --eval '(package-initialize)'
          -L emacs -f batch-byte-compile emacs/*.el
      - name: Run ERT
        run: >-
          emacs -Q --batch -l package --eval '(package-initialize)'
          -L emacs -L test -l test/mara-test.el -f ert-run-tests-batch-and-exit
